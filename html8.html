<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        span {
            color: red;
            font-size: 12px;
        }
    </style>
</head>
<body>

        <form action="todo.html" id="signUpForm" onsubmit="handleSubmit(event)">
        <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" id="name" class="form-control" placeholder="Enter your full name">
            <span id="name-error"></span>
        </div>

        <div class="mb-3">
            <label for="age" class="form-label">Age</label>
            <input type="number" id="age" class="form-control" placeholder="Enter your age">
            <span id="age-error"></span>
        </div>

        <div class="mb-3">
            <label for="gender" class="form-label">Gender</label>
            <select id="gender" class="form-select">
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <span id="gender-error"></span>
        </div>

        <div class="mb-3">
            <label for="profile" class="form-label">Upload Your Profile</label>
            <input type="file" id="profile" class="form-control">
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Enter your password">
            <span id="password-error"></span>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-control" placeholder="Enter your email">
            <span id="email-error"></span>
        </div>

        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <input type="text" id="address" class="form-control" placeholder="Enter your address">
            <span id="address-error"></span>
        </div>

        <div class="mb-3">
            <label for="color" class="form-label">Favorite Color</label>
            <input type="color" id="color" class="form-control form-control-color">
        </div>

        <div class="mb-3">
            <label for="dob" class="form-label">Date of Birth</label>
            <input type="date" id="dob" class="form-control">
            <span id="dob-error"></span>
        </div>

        <div class="mb-3">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="tel" id="phone" class="form-control" placeholder="Enter your phone number">
            <span id="phone-error"></span>
        </div>

        <div class="mb-3">
            <label for="education" class="form-label">Education</label>
            <input type="text" id="education" class="form-control" placeholder="Enter your education">
            <span id="education-error"></span>
        </div>

        <div class="mb-3">
            <label for="resume" class="form-label">Upload Your Resume</label>
            <input type="file" id="resume" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary w-100">Submit</button>
    </form>

    <script>
        function validateForm(event) {
            event.preventDefault();
            let isValid = true;
    
            // Validate Name
            const name = document.getElementById('name').value.trim();
            const nameRegex = /^[A-Za-z\s]+$/;
            if (!nameRegex.test(name) || name === '') {
                document.getElementById('name-error').innerText = "Enter a valid name.";
                isValid = false;
            } else {
                document.getElementById('name-error').innerText = "";
            }
    
            // If valid, redirect to todo.html
            if (isValid) {
                alert("Form Submitted Successfully!");
                window.location.href = "todo.html"; // Corrected navigation
            }
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
  
    
    
</body>
</html>
